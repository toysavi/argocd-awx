# =============================================================
# Phase 3: Deploy AWX via ArgoCD Application (FIXED)
# Uses Git repo (NOT Helm repo) — correct for AWX Operator
# =============================================================

- name: Create AWX namespace
  ansible.builtin.shell: |
    kubectl create namespace {{ awx_namespace }} --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false


# -----------------------------
# TLS SECRET
# -----------------------------
- name: Read SSL certificate from control node
  ansible.builtin.slurp:
    src: "{{ ssl_cert_path }}"
  register: ssl_cert_content
  delegate_to: localhost

- name: Read SSL key from control node
  ansible.builtin.slurp:
    src: "{{ ssl_key_path }}"
  register: ssl_key_content
  delegate_to: localhost

- name: Create AWX TLS secret
  ansible.builtin.shell: |
    kubectl create secret tls awx-tls-secret \
      --cert=<(echo "{{ ssl_cert_content.content | b64decode }}") \
      --key=<(echo "{{ ssl_key_content.content | b64decode }}") \
      --namespace={{ awx_namespace }} \
      --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false


# -----------------------------
# AWX ADMIN SECRET
# -----------------------------
- name: Create AWX admin password secret
  ansible.builtin.shell: |
    kubectl create secret generic awx-admin-password \
      --from-literal=password="{{ awx_admin_password }}" \
      --namespace={{ awx_namespace }} \
      --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  no_log: true
  changed_when: false


# -----------------------------
# PV FOR PROJECTS
# -----------------------------
- name: Create AWX projects directory
  ansible.builtin.file:
    path: "{{ local_storage_path }}/awx-projects"
    state: directory
    mode: '0755'

- name: Create PersistentVolume for AWX projects
  ansible.builtin.shell: |
    kubectl apply -f - <<EOF
    apiVersion: v1
    kind: PersistentVolume
    metadata:
      name: awx-projects-pv
    spec:
      capacity:
        storage: 8Gi
      accessModes:
        - ReadWriteOnce
      storageClassName: local-storage
      hostPath:
        path: {{ local_storage_path }}/awx-projects
        type: DirectoryOrCreate
      persistentVolumeReclaimPolicy: Retain
    EOF
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false


# -----------------------------
# FIXED ARGOCD APPLICATION (IMPORTANT PART)
# -----------------------------
- name: Create AWX ArgoCD Application
  ansible.builtin.shell: |
    kubectl apply -f - <<EOF
    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: awx
      namespace: {{ argocd_namespace }}
    spec:
      project: default
      source:
        repoURL: {{ awx_repo_url }}
        targetRevision: main
        path: {{ awx_repo_path }}
      destination:
        server: https://kubernetes.default.svc
        namespace: {{ awx_namespace }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
    EOF
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false


# -----------------------------
# WAIT FOR OPERATOR + AWX
# -----------------------------
- name: Wait AWX operator ready
  ansible.builtin.shell: |
    kubectl get pods -n {{ awx_namespace }} | grep awx || true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Wait AWX deployment
  ansible.builtin.shell: |
    kubectl wait --for=condition=available deployment \
      --all -n {{ awx_namespace }} --timeout=600s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  retries: 10
  delay: 60
  register: awx_ready
  until: awx_ready.rc == 0
  changed_when: false


# -----------------------------
# TRAEFIK
# -----------------------------
- name: Apply AWX Traefik IngressRoute
  ansible.builtin.shell: |
    kubectl apply -f - <<'EOF'
    {{ lookup('template', 'ingressroute.yml.j2') }}
    EOF
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false


# -----------------------------
# OUTPUT
# -----------------------------
- name: Print AWX access info
  ansible.builtin.debug:
    msg:
      - "AWX URL   : https://{{ awx_fqdn }}"
      - "Username  : admin"
      - "Password  : {{ awx_admin_password }}"