---
# =============================================================================
# Master Playbook: k3s + ArgoCD + AWX full stack deployment
# Usage: ansible-playbook site.yml -i inventory/hosts.ini
# =============================================================================

- name: "Phase 1 — Install k3s cluster"
  hosts: k3s_masters
  roles:
    - role: k3s

- name: "Phase 2 — Deploy ArgoCD with RBAC + LDAP"
  hosts: k3s_masters
  roles:
    - role: argocd

- name: "Phase 3 — Deploy AWX Operator + AWX instance"
  hosts: k3s_masters
  roles:
    - role: awx

- name: "Phase 4 — Configure AWX LDAP settings"
  hosts: k3s_masters
  roles:
    - role: ldap-config
  when: ldap_enabled | bool
