---
# =============================================================================
# SINGLE SOURCE OF TRUTH — Edit only this file
# =============================================================================

# -----------------------------------------------------------------------------
# Domain / FQDN
# -----------------------------------------------------------------------------
base_domain: "domain.com"
argocd_fqdn: "argocd-awx.{{ base_domain }}"
awx_fqdn:    "awx-prod.{{ base_domain }}"

# -----------------------------------------------------------------------------
# TLS / Certificates (cert-manager → Traefik terminates)
# -----------------------------------------------------------------------------
tls_issuer: "letsencrypt-prod"    # letsencrypt-prod | letsencrypt-staging | selfsigned
tls_email:  "admin@{{ base_domain }}"

# -----------------------------------------------------------------------------
# k3s — single node, Traefik already included
# -----------------------------------------------------------------------------
k3s_version:      "v1.29.5+k3s1"
k3s_master_ip:    "192.168.1.10"      # ← your server IP / hostname
k3s_cluster_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"

# Traefik is k3s built-in — we only patch it to ensure 443 hostPort is open
# and to enable the cert-manager integration (certificatesresolvers NOT used;
# cert-manager issues certs and stores them as Secrets; Traefik reads them via
# IngressRoute tls.secretName)
traefik_namespace: "kube-system"

# StorageClass (k3s default)
k3s_storage_class: "local-path"

# -----------------------------------------------------------------------------
# Namespaces to pre-create
# -----------------------------------------------------------------------------
k8s_namespaces:
  - "{{ argocd_namespace }}"
  - "{{ awx_namespace }}"
  - "cert-manager"

# -----------------------------------------------------------------------------
# ArgoCD
# -----------------------------------------------------------------------------
argocd_namespace:      "argocd"
argocd_version:        "v2.11.3"          # Helm chart version
argocd_admin_password: "ChangeMeArgoCD@2025!"

argocd_git_repo:     "https://github.com/your-org/k3s-apps.git"
argocd_git_revision: "main"

# ArgoCD RBAC → LDAP group bindings
argocd_rbac:
  admin:
    groups: ["argocd-admins"]
  dev:
    groups: ["argocd-developers"]
  readonly:
    groups: ["argocd-readonly"]
  awx:
    groups: ["argocd-awx"]

# LDAP config for ArgoCD (dex connector)
argocd_ldap:
  enabled: true
  host:          "ldap.{{ base_domain }}"
  port:          389
  start_tls:     false
  insecure:      false
  bind_dn:       "cn=svc-argocd,ou=ServiceAccounts,dc=domain,dc=com"
  bind_password: "ChangeMeLDAPArgo@2025!"
  user_search:
    base_dn:       "ou=Users,dc=domain,dc=com"
    filter:        "(objectClass=posixAccount)"
    username_attr: "uid"
    id_attr:       "uid"
    email_attr:    "mail"
    name_attr:     "cn"
  group_search:
    base_dn:  "ou=Groups,dc=domain,dc=com"
    filter:   "(objectClass=groupOfNames)"
    name_attr: "cn"

# -----------------------------------------------------------------------------
# AWX
# -----------------------------------------------------------------------------
awx_namespace:        "awx"
awx_operator_version: "2.19.1"
awx_instance_name:    "awx-prod"
awx_admin_user:       "admin"
awx_admin_password:   "ChangeMeAWX@2025!"
awx_admin_email:      "admin@{{ base_domain }}"
awx_replicas:         1

awx_web_resources:
  requests: { cpu: "500m",  memory: "1Gi" }
  limits:   { cpu: "2000m", memory: "4Gi" }
awx_task_resources:
  requests: { cpu: "500m",  memory: "1Gi" }
  limits:   { cpu: "2000m", memory: "4Gi" }

awx_postgres_storage_class: "local-path"
awx_postgres_storage_size:  "20Gi"
awx_db_password:            "ChangeMeDB@2025!"

awx_extra_settings:
  - setting: SESSION_COOKIE_AGE
    value: "1800"
  - setting: CSRF_TRUSTED_ORIGINS
    value: "['https://{{ awx_fqdn }}']"

# -----------------------------------------------------------------------------
# LDAP — AWX (configured via AWX REST API after deploy)
# -----------------------------------------------------------------------------
ldap_enabled: true

ldap_server_uri:    "ldap://ldap.{{ base_domain }}:389"
ldap_bind_dn:       "cn=svc-awx,ou=ServiceAccounts,dc=domain,dc=com"
ldap_bind_password: "ChangeMeLDAP@2025!"
ldap_start_tls:     false

ldap_base_dn:         "dc=domain,dc=com"
ldap_user_search_dn:  "ou=Users,{{ ldap_base_dn }}"
ldap_group_search_dn: "ou=Groups,{{ ldap_base_dn }}"

ldap_user_attr_map:
  first_name: "givenName"
  last_name:  "sn"
  email:      "mail"

ldap_require_group:   "cn=awx-users,ou=Groups,{{ ldap_base_dn }}"
ldap_superuser_group: "cn=awx-admins,ou=Groups,{{ ldap_base_dn }}"
ldap_auditor_group:   "cn=awx-auditors,ou=Groups,{{ ldap_base_dn }}"

ldap_group_type: "MemberDNGroupType"
ldap_group_type_params:
  member_attr: "member"

# -----------------------------------------------------------------------------
# Ansible connection
# -----------------------------------------------------------------------------
ansible_user:               "ubuntu"
ansible_become:             true
ansible_python_interpreter: "/usr/bin/python3"
