---
apiVersion: awx.ansible.com/v1beta1
kind: AWX
metadata:
  name: awx-uat                    # ← change to awx-prod for production
  namespace: awx
spec:
  service_type: ClusterIP
  ingress_type: none

  # Display name shown in the AWX web UI header
  task_args:
    - AWX_DEPLOYMENT_NAME="AWX_UAT"   # ← change to "AWX PROD" for production

  admin_user: admin
  admin_password_secret: awx-admin-password

  projects_persistence: true
  projects_existing_claim: ""
  projects_storage_size: 8Gi
  projects_storage_access_mode: ReadWriteOnce
  projects_storage_class: local-path

  web_resource_requirements:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

  task_resource_requirements:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 4Gi