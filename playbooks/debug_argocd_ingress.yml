---
- name: Debug ArgoCD Ingress / Traefik
  hosts: k3s_nodes
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all/vars.yml

  tasks:

    - name: Check IngressRoutes
      ansible.builtin.shell: kubectl get ingressroute -A
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: ingress
      changed_when: false
    - debug: msg="{{ ingress.stdout_lines }}"

    - name: Check ArgoCD IngressRoute detail
      ansible.builtin.shell: |
        kubectl get ingressroute argocd-server-tls -n {{ argocd_namespace }} -o yaml 2>/dev/null \
        || echo "IngressRoute NOT FOUND"
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: ir_detail
      changed_when: false
    - debug: msg="{{ ir_detail.stdout_lines }}"

    - name: Check ArgoCD TLS secret
      ansible.builtin.shell: |
        kubectl get secret argocd-tls-secret -n {{ argocd_namespace }} \
          -o jsonpath='{.type} notAfter={.metadata.creationTimestamp}' 2>/dev/null \
        || echo "TLS SECRET NOT FOUND"
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: tls_secret
      changed_when: false
    - debug: msg="{{ tls_secret.stdout }}"

    - name: Check ArgoCD server service
      ansible.builtin.shell: kubectl get svc -n {{ argocd_namespace }}
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: argocd_svc
      changed_when: false
    - debug: msg="{{ argocd_svc.stdout_lines }}"

    - name: Check Traefik pods
      ansible.builtin.shell: kubectl get pods -n kube-system -l app.kubernetes.io/name=traefik
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: traefik_pods
      changed_when: false
    - debug: msg="{{ traefik_pods.stdout_lines }}"

    - name: Check Traefik service / external IP
      ansible.builtin.shell: kubectl get svc -n kube-system -l app.kubernetes.io/name=traefik
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: traefik_svc
      changed_when: false
    - debug: msg="{{ traefik_svc.stdout_lines }}"

    - name: Check Traefik logs for errors
      ansible.builtin.shell: |
        kubectl logs -n kube-system \
          -l app.kubernetes.io/name=traefik \
          --tail=30 2>/dev/null
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: traefik_logs
      changed_when: false
    - debug: msg="{{ traefik_logs.stdout_lines }}"

    - name: Test ArgoCD service directly (bypass Traefik)
      ansible.builtin.shell: |
        curl -sk --max-time 5 \
          http://$(kubectl get svc argocd-server -n {{ argocd_namespace }} \
          -o jsonpath='{.spec.clusterIP}') | head -5 \
        || echo "DIRECT ACCESS FAILED"
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: direct_test
      changed_when: false
    - debug: msg="{{ direct_test.stdout_lines }}"

    - name: Test port 443 on node
      ansible.builtin.shell: |
        curl -sk --max-time 5 https://{{ node_ip }} -o /dev/null -w "HTTP_CODE=%{http_code}" \
        || echo "PORT 443 UNREACHABLE"
      register: port_test
      changed_when: false
    - debug: msg="{{ port_test.stdout }}"

    - name: Check ArgoCD server args (insecure mode)
      ansible.builtin.shell: |
        kubectl get deployment argocd-server -n {{ argocd_namespace }} \
          -o jsonpath='{.spec.template.spec.containers[0].args}' | tr ',' '\n'
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: argocd_args
      changed_when: false
    - debug: msg="{{ argocd_args.stdout_lines }}"