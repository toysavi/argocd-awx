---
# =============================================================================
# Role: argocd
# TLS terminated at Traefik via IngressRoute → ArgoCD runs --insecure (HTTP)
# =============================================================================

- name: "argocd | Add Helm repo"
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: "argocd | Deploy ArgoCD via Helm"
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    chart_version: "{{ argocd_version }}"
    release_namespace: "{{ argocd_namespace }}"
    create_namespace: true
    values: "{{ lookup('template', 'argocd-values.yaml.j2') | from_yaml }}"
    wait: true
    timeout: "10m0s"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: "argocd | Wait for server rollout"
  ansible.builtin.shell: |
    kubectl rollout status deploy/argocd-server -n {{ argocd_namespace }} --timeout=180s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

# Certificate — cert-manager issues it; Traefik IngressRoute reads secretName
- name: "argocd | Create Certificate resource"
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'argocd-certificate.yaml.j2') }}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: "argocd | Wait for certificate to be ready"
  ansible.builtin.shell: |
    kubectl wait certificate/argocd-tls \
      -n {{ argocd_namespace }} \
      --for=condition=Ready \
      --timeout=120s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  retries: 5
  delay: 15
  register: cert_wait
  until: cert_wait.rc == 0

# Traefik IngressRoute (CRD) — routes HTTPS traffic to argocd-server:80
- name: "argocd | Apply Traefik IngressRoute"
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'argocd-ingressroute.yaml.j2') }}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: "argocd | Install argocd CLI"
  ansible.builtin.get_url:
    url: "https://github.com/argoproj/argo-cd/releases/download/{{ argocd_version }}/argocd-linux-amd64"
    dest: /usr/local/bin/argocd
    mode: '0755'
